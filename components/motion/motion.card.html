<!-- @dsCard group="Components" viewport="700x320" name="Motion — Scroll Reveal" subtitle="Fade-and-rise on entry; images settle from over-scale" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); }
  .lbl { font: var(--label); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--text-muted); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .frame { aspect-ratio: 4/3; border-radius: var(--radius-md); }
  .frame img { width: 100%; height: 100%; object-fit: cover; }
  .replay { margin-top: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Reveal, RevealImage, Button, Eyebrow } = window.JWTDesignStudioDesignSystem_593c65;
  const { useState } = React;
  const IMGS = [
    "https://images.unsplash.com/photo-1631679706909-1844bbd07221?w=500&q=70",
    "https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?w=500&q=70",
    "https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=500&q=70",
  ];
  function Demo() {
    const [k, setK] = useState(0);
    return (
      <div key={k}>
        <p className="lbl">Staggered text + image reveal</p>
        <Reveal><Eyebrow dot>Selected projects</Eyebrow></Reveal>
        <Reveal delay={120}>
          <h2 style={{ font: 'var(--display-lg)', margin: '10px 0 20px' }}>Recently delivered</h2>
        </Reveal>
        <div className="grid">
          {IMGS.map((src, i) => (
            <RevealImage key={i} delay={240 + i * 140} className="frame">
              <img src={src} alt="" />
            </RevealImage>
          ))}
        </div>
        <div className="replay">
          <Button variant="outline" size="sm" onClick={() => setK(k + 1)}>Replay</Button>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
