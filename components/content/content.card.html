<!-- @dsCard group="Components" viewport="700x540" name="Content — Cards, Stats, Quote, Services" subtitle="Project tiles, figures, testimonials, service rows" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px 30px; background: var(--bg-page); }
  .lbl { font: var(--label); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: start; }
  .stats { display: flex; gap: 38px; margin-bottom: 30px; }
  section { margin-bottom: 30px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { ProjectCard, Figure, StatBlock, Quote, ServiceCard, Badge } = window.JWTDesignStudioDesignSystem_593c65;
  const IMG = "https://images.unsplash.com/photo-1631679706909-1844bbd07221?w=600&q=70";
  const IMG2 = "https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=600&q=70";
  function Demo() {
    return (
      <div>
        <section className="stats">
          <StatBlock value="10" suffix="+" label="Years in practice" />
          <StatBlock value="2" label="Studios — Dubai & Beirut" />
          <StatBlock value="3" label="Disciplines in-house" />
        </section>
        <div className="grid">
          <div>
            <p className="lbl">Project card</p>
            <ProjectCard src={IMG} title="Marsa Villa" discipline="Interiors"
              sector="Residential" region="Dubai" year={2024}
              badge={<Badge tone="ink">Featured</Badge>} />
          </div>
          <div>
            <p className="lbl">Figure</p>
            <Figure src={IMG2} ratio="16 / 10" caption="Sitting room" meta="Beirut · 2023" />
            <section style={{ marginTop: '22px' }}>
              <p className="lbl">Quote</p>
              <Quote size="md" author="JWT Design Studio" role="Dubai | Beirut">
                Committed to delivering tailor-made projects.
              </Quote>
            </section>
          </div>
        </div>
        <section>
          <p className="lbl">Service / discipline row</p>
          <ServiceCard index="01" title="Interiors"
            description="Tailor-made interiors, resolved to the last detail — from the first spatial move to the final styled layer."
            items={['Space planning', 'Bespoke joinery', 'FF&E', 'Styling']} />
        </section>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
