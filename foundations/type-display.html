<!-- @dsCard group="Type" viewport="700x320" name="Display — Avenir Next Ultra Light" subtitle="Weight 200 for headlines, tightened tracking" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); color: var(--text-primary); }
  .spec { display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--line-subtle); padding-bottom: 12px; }
  .tag { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-muted); width: 118px; flex: 0 0 auto; letter-spacing: 0.04em; }
  .d2xl { font: var(--display-2xl); letter-spacing: var(--track-display); }
  .dxl { font: var(--display-xl); letter-spacing: var(--track-display); }
  .dlg { font: var(--display-lg); letter-spacing: var(--track-display); }
  .dmd { font: var(--display-md); letter-spacing: var(--track-tight); }
</style></head>
<body>
  <div class="spec">
    <div class="line"><span class="tag">2xl · 200</span><span class="d2xl">Considered</span></div>
    <div class="line"><span class="tag">xl · 200</span><span class="dxl">Turning vision into reality</span></div>
    <div class="line"><span class="tag">lg · 200</span><span class="dlg">Selected projects</span></div>
    <div class="line" style="border:none"><span class="tag">md · 300</span><span class="dmd">Three disciplines, one team</span></div>
  </div>
</body></html>
