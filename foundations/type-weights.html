<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); color: var(--text-primary); }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 7px 0; border-bottom: 1px solid var(--line-subtle); }
  .row:last-child { border: none; }
  .tag { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-muted); width: 150px; flex: 0 0 auto; letter-spacing: 0.03em; }
  .s { font-family: var(--font-sans); font-size: 1.5rem; }
  .use { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-accent); margin-left: auto; letter-spacing: 0.04em; }
</style></head>
<body>
  <div class="row"><span class="tag">200 · Ultra Light</span><span class="s" style="font-weight:200">Turning vision</span><span class="use">DISPLAY — THE BRAND WEIGHT</span></div>
  <div class="row"><span class="tag">300 · Light</span><span class="s" style="font-weight:300">Turning vision</span><span class="use">LEDE · LARGE BODY</span></div>
  <div class="row"><span class="tag">400 · Regular</span><span class="s" style="font-weight:400">Turning vision</span><span class="use">READING COPY · UI</span></div>
  <div class="row"><span class="tag">500 · Medium</span><span class="s" style="font-weight:500">Turning vision</span><span class="use">TRACKED LABELS</span></div>
</body></html>
