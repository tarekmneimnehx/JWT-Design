<!-- @dsCard group="Spacing" viewport="700x180" name="Radii & Shadows" subtitle="Restrained corners, soft warm-tinted shadows" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); color: var(--text-primary); }
  .group { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 74px; height: 56px; background: var(--bg-elevated); border: 1px solid var(--line); }
  .tag { font-family: var(--font-mono); font-size: 0.64rem; color: var(--text-muted); }
  .sh { border: none; }
  .divider { width:1px; align-self:stretch; background:var(--line-subtle); }
</style></head>
<body>
  <div class="group">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="tag">sm · 4</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="tag">md · 8</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="tag">lg · 14</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="tag">xl · 22</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="tag">pill</span></div>
    <div class="divider"></div>
    <div class="item"><div class="box sh" style="border-radius:8px;box-shadow:var(--shadow-sm)"></div><span class="tag">shadow-sm</span></div>
    <div class="item"><div class="box sh" style="border-radius:8px;box-shadow:var(--shadow-md)"></div><span class="tag">shadow-md</span></div>
    <div class="item"><div class="box sh" style="border-radius:8px;box-shadow:var(--shadow-lg)"></div><span class="tag">shadow-lg</span></div>
  </div>
</body></html>
