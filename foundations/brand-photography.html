<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-page); color: var(--text-primary); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  figure { margin: 0; }
  .frame { aspect-ratio: 3/4; border-radius: var(--radius-md); overflow: hidden; background: var(--bg-fill); }
  img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); margin-top: 7px; letter-spacing: 0.03em; }
</style></head>
<body>
  <div class="grid">
    <figure><div class="frame"><img src="https://images.unsplash.com/photo-1631679706909-1844bbd07221?w=400&q=70" alt=""></div><figcaption>Warm minimal</figcaption></figure>
    <figure><div class="frame"><img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=400&q=70" alt=""></div><figcaption>Natural light</figcaption></figure>
    <figure><div class="frame"><img src="https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?w=400&q=70" alt=""></div><figcaption>Lived-in</figcaption></figure>
    <figure><div class="frame"><img src="https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=70" alt=""></div><figcaption>The makers</figcaption></figure>
  </div>
</body></html>
