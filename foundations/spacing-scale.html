<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); color: var(--text-primary); }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .tag { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); width: 130px; flex: 0 0 auto; }
  .bar { height: 16px; background: var(--tan-600); border-radius: 3px; }
</style></head>
<body>
  <div class="row"><span class="tag">--space-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tag">--space-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tag">--space-5 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tag">--space-6 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tag">--space-7 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tag">--space-8 · 64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="tag">--space-9 · 96</span><div class="bar" style="width:96px"></div></div>
  <div class="row"><span class="tag">--space-11 · 176</span><div class="bar" style="width:176px"></div></div>
</body></html>
