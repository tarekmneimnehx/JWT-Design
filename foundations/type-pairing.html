<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 30px; background: var(--bg-page); color: var(--text-primary); }
  .eb { font: var(--label); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--text-accent); display:inline-flex; align-items:center; gap:.6em; margin-bottom: 18px; }
  .eb .dot { width:6px; height:6px; border-radius:99px; background:var(--tan-600); }
  h2 { font: var(--display-xl); letter-spacing: var(--track-display); margin: 0 0 18px; max-width: 20ch; text-wrap: balance; }
  p { font: var(--lede); color: var(--text-secondary); max-width: 52ch; margin: 0; }
  strong { font-weight: 400; color: var(--text-primary); }
</style></head>
<body>
  <span class="eb"><span class="dot"></span>The Studio</span>
  <h2>Turning vision into reality.</h2>
  <p>An upscale design studio led by two sisters across Dubai and Beirut — committed to <strong>tailor-made projects</strong>, delivered from concept to completion.</p>
</body></html>
