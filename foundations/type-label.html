<!-- @dsCard group="Type" viewport="700x180" name="Eyebrow / Label / Meta Run" subtitle="Weight 500, uppercase, 0.14–0.2em tracking" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); color: var(--text-primary); }
  .spec { display: flex; flex-direction: column; gap: 16px; }
  .eb { font: var(--label); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--text-accent); display: inline-flex; align-items:center; gap:0.6em; }
  .eb .dot { width:6px; height:6px; border-radius:99px; background:var(--tan-600); }
  .muted { color: var(--text-muted); }
  .row { display:flex; gap:30px; align-items:center; flex-wrap:wrap; }
  .meta { font: var(--label-sm); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-muted); display:flex; gap:0.55rem; }
  .meta .first { color: var(--text-accent); }
  .tag { font-family: var(--font-mono); font-size: 0.64rem; color: var(--text-muted); }
</style></head>
<body>
  <div class="spec">
    <div class="row">
      <span class="eb"><span class="dot"></span>Our Expertise</span>
      <span class="eb muted">01 — Discovery</span>
    </div>
    <div class="meta">
      <span class="first">Interiors</span><span style="opacity:.45">/</span>
      <span>Residential</span><span style="opacity:.45">/</span>
      <span>Dubai</span><span style="opacity:.45">/</span><span>2024</span>
    </div>
    <div class="tag">Avenir Next · 500 · uppercase · eyebrow 0.2em / meta 0.14em</div>
  </div>
</body></html>
