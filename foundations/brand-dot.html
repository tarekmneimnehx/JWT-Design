<!-- @dsCard group="Brand" viewport="700x200" name="The Dot Motif" subtitle="The taupe tittle from the mark, used as punctuation" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 30px; background: var(--bg-page); color: var(--text-primary); }
  .wrap { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  .big { width: 64px; height: 64px; border-radius: 999px; background: var(--tan-600); flex: 0 0 auto; }
  .uses { display: flex; flex-direction: column; gap: 16px; }
  .eb { font: var(--label); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--text-accent); display:inline-flex; align-items:center; gap:.6em; }
  .eb .dot { width:6px;height:6px;border-radius:99px;background:var(--tan-600); }
  .h { font: var(--display-md); display:inline-flex; align-items:center; gap:.3em; }
  .h .dot { width:9px;height:9px;border-radius:99px;background:var(--tan-600); }
  .note { font: var(--text-sm); color: var(--text-secondary); max-width: 40ch; }
</style></head>
<body>
  <div class="wrap">
    <div class="big"></div>
    <div class="uses">
      <span class="eb"><span class="dot"></span>Eyebrow lead</span>
      <span class="h">JWT<span class="dot"></span></span>
      <span class="note">A single taupe dot — lifted from the logo's tittle — appears as a quiet full-stop, bullet, or eyebrow lead. Never more than one per cluster.</span>
    </div>
  </div>
</body></html>
