<!-- @dsCard group="Colors" viewport="700x180" name="Charcoal & Grey" subtitle="The brand's cool neutral — grey-blue, never warm black" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--bg-page); }
  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 76px; border-radius: var(--radius-md); border: 1px solid var(--line-subtle); position: relative; }
  .star { position:absolute; top:8px; right:8px; font-family:var(--font-mono); font-size:0.58rem; letter-spacing:0.08em; color:#fff; background:rgba(44,46,53,.6); padding:2px 6px; border-radius:99px; }
  .name { font: var(--text-xs); color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.02em; }
</style></head>
<body>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:var(--char-900)"><span class="star">LOGO</span></div><span class="name">Char 900 · ink</span><span class="hex">#2C2E35</span></div>
    <div class="sw"><div class="chip" style="background:var(--char-800)"></div><span class="name">Char 800</span><span class="hex">#3A3D44</span></div>
    <div class="sw"><div class="chip" style="background:var(--char-700)"><span class="star">BRAND</span></div><span class="name">Char 700 · dark</span><span class="hex">#494F55</span></div>
    <div class="sw"><div class="chip" style="background:var(--char-600)"></div><span class="name">Char 600 · wordmark</span><span class="hex">#5A5C61</span></div>
    <div class="sw"><div class="chip" style="background:var(--char-500)"></div><span class="name">Char 500</span><span class="hex">#63656B</span></div>
    <div class="sw"><div class="chip" style="background:var(--char-400)"></div><span class="name">Char 400</span><span class="hex">#707272</span></div>
    <div class="sw"><div class="chip" style="background:var(--char-300)"></div><span class="name">Char 300</span><span class="hex">#7B7D81</span></div>
  </div>
</body></html>
